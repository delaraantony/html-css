<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14 - Tabela de notas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
        }
        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }
        th, td {
            border: 1px solid grey;
            padding: 10px;
        }
        thead {
            background-color: darkgray;
        }
        .media{
            background-color: dimgray;
            color: whitesmoke;
            font-weight: bold; /* Adicionado para garantir negrito nas médias */
        }
        /* Estilo opcional para alinhar números à direita */
        td.nota {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Tabela de notas do Aluno</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Area</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="5">Exatas</th>
            </tr>
            <tr>
                <td>Matemática</td>
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
            </tr>
            <tr>
                <td>Física</td>
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
            </tr>
            <tr>
                <td>Química</td>
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
            </tr>
        </tbody>    
        <tbody>
            <tr>
                <td colspan="4" class="media">Média de Exatas</td>
                <td class="media">0.0</td>  <!-- Mantido como td mas com classe media -->
            </tr>
        </tbody>
        <tbody>
            <tr>
                <th rowspan="3">Humanas</th>
            </tr>
            <tr>
                <td>História</td>
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
                <td class="nota">0.0</td>  <!-- Mudado de th para td -->
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4" class="media">Média de Humanas</td>
                <td class="media">0.0</td>  <!-- Mantido como td mas com classe media -->
            </tr>
        </tfoot>
    </table>
</body>
</html>
